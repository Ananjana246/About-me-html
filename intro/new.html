<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forms</title>
</head>

<body>

    <form>
        <h1 style="text-align:center;">ANANJANA K</h1>
    <h2>My Hobbies are:</h2>
    <ul>
        <li>Playing badminton</li>
        <li>Reading</li>
        <li>Traveling</li>
    </ul>
        <img src="mee.jpeg" width="150" height="200"><br><br>
        <label for="name">Name:</label><br>
        <input type="text" id="name" name="name" required><br><br>
        <label for="email">Email:</label><br>
        <input type="email" id="email" name="email" required><br><br>
        <label for="number">Phone Number:</label><br>
        <input type="tel" id="number" name="number" required><br><br>
        <label for="message">Type the message:</label><br>
        <textarea name="message" rows="10" cols="20" required></textarea><br><br>
        <input type="submit" value="submit">
    </form>

</body>
</html>
